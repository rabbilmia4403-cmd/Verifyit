name: Build Expo App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ১. রিপোজিটরি কোড চেকআউট করা
      - name: Checkout repository
        uses: actions/checkout@v4

      # ২. Node.js সেটআপ করা
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # ৩. pnpm সেটআপ করা (সবার আগে)
      - name: Install pnpm
        run: npm install -g pnpm

      # ৪. pnpm সংস্করণ চেক করা
      - name: Verify pnpm installation
        run: pnpm --version

      # ৫. প্রজেক্টের ডিপেন্ডেন্সি ইনস্টল করা
      - name: Install dependencies
        run: pnpm install

      # ৬. Expo CLI সেটআপ করা
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # ৭. বিল্ড চেক করা
      - name: Run Expo Doctor
        run: npx expo-doctor
