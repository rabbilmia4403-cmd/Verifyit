name: Build Expo App

on:
  push:
    branches: [ "main" ] # আপনার জমানো ব্রাঞ্চের নাম এখানে দিন (যেমন: main বা master)
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ১. রিপোজিটরি কোড চেকআউট করা
      - name: Check out repository
        uses: actions/checkout@v4

      # ২. Node.js সেটআপ করা
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # ৩. pnpm সেটআপ করা
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      # ৪. pnpm ক্যাশ সেটআপ করা
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # ৫. Expo CLI সেটআপ করা
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }} # আপনার এক্সপো টোকেন না থাকলে অপশনাল হিসেবে রাখতে পারেন

      # ৬. প্রজেক্টের ডিপেন্ডেন্সি ইনস্টল করা
      - name: Install dependencies
        run: pnpm install

      # ৭. প্রোজেক্ট ভ্যালিডেশন বা টেস্ট (প্রয়োজনীয় হলে)
      - name: Run Expo Doctor / Check
        run: npx expo-doctor
