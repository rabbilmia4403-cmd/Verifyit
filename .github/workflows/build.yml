name: Build Expo App

on:
  push:
    branches: [ "main" ] # আপনার জমানো ব্রাঞ্চের নাম এখানে দিন (যেমন: main বা master)
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ১. রিপোজিটরি কোড চেকআউট করা
      - name: Check out repository
        uses: actions/checkout@v4

      # ২. Node.js সেটআপ করা (ক্যাশ ছাড়া)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # ৩. pnpm সেটআপ করা (স্পেসিফিক ভার্সন)
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          run_install: false

      # ৪. pnpm স্টোর পাথ নির্ধারণ করা
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
    
      # ৬. প্রজেক্টের ডিপেন্ডেন্সি ইনস্টল করা
            - name: Install dependencies
        run: pnpm install --no-frozen-lockfile


      # ৭. Expo CLI সেটআপ করা
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # ৮. প্রোজেক্ট ভ্যালিডেশন বা টেস্ট
      - name: Run Expo Doctor / Check
        run: npx expo-doctor
