name: Build Expo App

on:
  push:
    branches: [ "main" ] # আপনার জমানো ব্রাঞ্চের নাম এখানে দিন (যেমন: main বা master)
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ১. রিপোজিটরি কোড চেকআউট করা
      - name: Check out repository
        uses: actions/checkout@v4

      # ২. Node.js সেটআপ করা
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      # ৩. Expo CLI সেটআপ করা
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }} # আপনার এক্সপো টোকেন না থাকলে অপশনাল হিসেবে রাখতে পারেন

      # ৪. প্রজেক্টের ডিপেন্ডেন্সি ইনস্টল করা
      - name: Install dependencies
        run: npm install

      # ৫. প্রোজেক্ট ভ্যালিডেশন বা টেস্ট (প্রয়োজনীয় হলে)
      - name: Run Expo Doctor / Check
        run: npx expo-doctor
